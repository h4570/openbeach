# Keeps the picture of the stargazers up to date (tools/update_stargazers.py). A new star starts it; the daily run catches
# an unstar, which sends no event. The picture lives on the `stargazers-data` branch, which no ruleset protects, so `main`
# gets no commit per star and its pull request rule stays whole. The README embeds the file from that branch.
name: Stargazers

on:
  watch:
    types: [started]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stargazers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A star event carries the default branch; a dispatch on another branch would run another copy of the script.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Draw the picture
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/update_stargazers.py --out "$RUNNER_TEMP/stargazers.svg"
      - name: Publish on the data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin stargazers-data >/dev/null; then
            git fetch --depth=1 origin stargazers-data
            git checkout --force -B stargazers-data FETCH_HEAD
          else
            git checkout --orphan stargazers-data
            git rm -rf --quiet .
          fi
          cp "$RUNNER_TEMP/stargazers.svg" stargazers.svg
          git add stargazers.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: update the stargazers picture"
          git push origin HEAD:stargazers-data
