# Linux CI on the own L0 pack: no game data and no secrets. Lints, tool tests, unit tests, the headless L0 scripts and the
# WebAssembly build with its browser site. A run by hand with `deploy` publishes that site from main once every check passed.
name: CI

on:
  push:
    branches: [main]
    # A merged release pull request changes only these. Release dispatches this workflow with `deploy` for that commit right
    # after, and that run would cancel the push run, leaving a red cross on main. The pull request itself is still checked.
    paths-ignore:
      - .release-please-manifest.json
      - CHANGELOG.md
      - version.txt
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the browser site after the checks
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A change to documentation or the browser site alone (tools/ci_changes.py) skips the builds and game tests; lint still
  # checks the docs and the rendered site pages. Skipped jobs count as passed for the required checks, so the matrix job
  # `unit` skips its steps instead of the job: a skipped matrix job reports under another name.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Documentation or site only?
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) python3 tools/ci_changes.py --range "$PR_BASE...$PR_HEAD" >> "$GITHUB_OUTPUT" ;;
            push) python3 tools/ci_changes.py --range "$PUSH_BEFORE..$GITHUB_SHA" >> "$GITHUB_OUTPUT" ;;
            *) echo "code=true" >> "$GITHUB_OUTPUT" ;;
          esac

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # The commit check reads every commit of a pull request.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install clang-format==21.1.2 pillow
      - name: Formatting
        run: python tools/format.py --check
      - name: Docs layout
        run: python tools/check_docs.py
      - name: Docs links
        run: python tools/check_doc_links.py
      - name: Repository content
        run: python tools/check_content.py
      - name: Layer lint
        run: python tools/check_layers.py
      - name: Commit format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        # A pull request is squashed (its title counts) or rebased onto main (its commits count), so both are checked.
        run: |
          if [ -n "$PR_TITLE" ]; then python tools/check_commits.py "$PR_TITLE" --range "$PR_BASE..$PR_HEAD"
          else python tools/check_commits.py --range -1; fi
      - name: Tool tests
        run: |
          python tests/tools/test_check_docs.py
          python tests/tools/test_gui_frame_checkers.py
          python -m unittest discover -s tools/tests
      - name: Site checks
        run: |
          node web/site_pages.cjs build/site-pages
          node web/site_check.cjs web/site.js --pages build/site-pages

  unit:
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    name: unit (${{ matrix.compiler }})
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_MAXSIZE: 400M
      CCACHE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      OBL_UNIT_SKIP_DATA: "1"
      CODE: ${{ needs.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        if: env.CODE == 'true'
      - uses: actions/setup-python@v6
        if: env.CODE == 'true'
        with:
          python-version: "3.12"
      - name: Packages
        if: env.CODE == 'true'
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build zstd ccache clang
      - name: Compiler cache
        if: env.CODE == 'true'
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-${{ matrix.compiler }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.compiler }}-
      - name: Unit tests
        if: env.CODE == 'true'
        run: bash tools/unit_linux.sh ${{ matrix.compiler }} $CCACHE_ARGS -DOBL_UNIT_RELOCATABLE=ON

  sim:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      catalog_signed: ${{ steps.official_catalog.outputs.signed }}
    env:
      OBL_SIM_ONLY: "1"
      OBL_SIM_BUILD: ${{ github.workspace }}/build/linux-sim-x64
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_SLOPPINESS: pch_defines,time_macros
      CCACHE_MAXSIZE: 400M
      CCACHE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Packages
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build zstd ccache \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev
      - name: Compiler cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-sim-${{ github.sha }}
          restore-keys: ccache-sim-
      - name: L0 headless tests
        run: bash tools/ci/l0_sim_tests.sh $CCACHE_ARGS -DOBL_SIM_FAST_BUILD=ON -DOBL_LINUX_WINDOWED=ON
      - name: Mod checker on L0
        run: python3 tools/tests/check_mods_engine.py "$OBL_SIM_BUILD/bin/obl-sim"
      - name: Mod examples on L0
        run: |
          python3 -m pip install pillow
          cmake --build "$OBL_SIM_BUILD" --target OpenBeach obl_catalog_sign
          mkdir -p build/l0-run/mods
          cp -R data/mods/* tests/mods/l0_* docs/modding/examples/mod_template build/l0-run/mods/
          python3 tools/obl_sim_tests.py --windowed --no-build --jobs 1 --game-dir build/l0-run --filter \
            'l0_official_*' l0_mod_template_dev l0_mod_building l0_mod_object_script l0_mod_world_script \
            l0_mod_gui_patch l0_mod_settings l0_mod_actions l0_mod_install l0_mod_catalog
      - name: Official mod catalog
        id: official_catalog
        env:
          OBL_CATALOG_PRIVATE_KEY: ${{ secrets.OBL_CATALOG_PRIVATE_KEY }}
        run: |
          python3 -m unittest tools/tests/test_build_catalog.py
          if [ -n "$OBL_CATALOG_PRIVATE_KEY" ]; then
            python3 tools/build_catalog.py \
              --mods-dir data/mods \
              --out-dir build/official-catalog \
              --signer "$OBL_SIM_BUILD/bin/obl_catalog_sign" \
              --check-engine "$OBL_SIM_BUILD/bin/obl-sim" \
              --game-dir build/l0-run \
              --pack l0
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            python3 tools/build_catalog.py \
              --mods-dir data/mods \
              --out-dir build/official-catalog \
              --signer "$OBL_SIM_BUILD/bin/obl_catalog_sign" \
              --check-engine "$OBL_SIM_BUILD/bin/obl-sim" \
              --game-dir build/l0-run \
              --pack l0 \
              --ephemeral-key
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Official catalog artifact
        if: steps.official_catalog.outputs.signed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: official-catalog
          path: build/official-catalog
          if-no-files-found: error
          retention-days: 14
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: obl-sim-testlogs
          path: |
            build/l0-run/testlogs/linux
            build/l0-run/testlogs/linux-windowed
          retention-days: 7
          if-no-files-found: ignore

  wasm:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      EMSDK_VERSION: 6.0.13
      EMSDK: ${{ github.workspace }}/.emsdk
      OBL_WASM_BUILD: ${{ github.workspace }}/build/wasm
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPRESS: "1"
      CCACHE_SLOPPINESS: pch_defines,time_macros
      CCACHE_MAXSIZE: 600M
      CCACHE_ARGS: -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Packages
        run: |
          sudo apt-get -o Acquire::Retries=3 update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build zstd ccache
      - name: Emscripten cache
        id: emsdk_cache
        uses: actions/cache@v5
        with:
          path: .emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: Emscripten
        if: steps.emsdk_cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK"
          "$EMSDK/emsdk" install "$EMSDK_VERSION"
          "$EMSDK/emsdk" activate "$EMSDK_VERSION"
      - name: Compiler cache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-wasm-${{ github.sha }}
          restore-keys: ccache-wasm-
      - name: WebAssembly unit tests and obl-sim
        env:
          OBL_IMPORT_O3: ${{ inputs.deploy && '1' || '' }}
        run: bash tools/wasm_linux.sh $CCACHE_ARGS
      - name: Browser site
        uses: actions/upload-artifact@v6
        with:
          name: browser-site
          path: build/wasm/site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: wasm-testlogs
          path: build/wasm/l0-run/testlogs/linux
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    if: inputs.deploy && github.ref == 'refs/heads/main'
    needs: [lint, unit, sim, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download browser site
        uses: actions/download-artifact@v6
        with:
          name: browser-site
          path: build/pages-site
      - name: Download official mod catalog
        if: needs.sim.outputs.catalog_signed == 'true'
        uses: actions/download-artifact@v6
        with:
          name: official-catalog
          path: build/pages-site/mods
      - name: Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages-site
      - id: deployment
        uses: actions/deploy-pages@v5
