# Keeps a release pull request open with the next version and the changelog, computed from the commits on main. Merging it
# makes the tag and the GitHub release, then publishes the site. Events from github.token start no workflow, except a
# dispatch, so the site is asked for here and not on the `release` event. The run is on main: the Pages environment takes no tags.
name: Release

on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Publish the site
        if: steps.release.outputs.release_created
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f deploy=true
